name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11+ gerekiyor: `tomllib` standart kütüphaneye orada girdi.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Testler
        # Tarayıcı testleri Playwright kurulu değilse kendiliğinden atlanır —
        # proje bağımlılığı değil, CI'da da kurmuyoruz.
        run: python -m pytest -q

  gizlilik:
    # ★ Ayrı iş: bu araç öğrenci notları tutuyor. Repoya bir transkript ya da
    # veritabanı sızarsa geri almak zor (geçmişten temizlemek gerekir), o
    # yüzden her itmede ve her PR'da denetleniyor.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kişisel veri sızıntısı denetimi
        run: python tools/gizlilik_denetimi.py
