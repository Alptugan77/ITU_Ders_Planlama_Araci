# KATALOG DÜZELTMELERİ — kişisel değil, herkese ait.
#
# OBS'nin ders kataloğunda bazı alanlar yanlış doldurulmuş. Bu dosya o
# hataların düzeltmesini beyan eder. Kimin transkriptiyle ilgisi yoktur, o
# yüzden repoda durur ve herkes yararlanır.
#
# ⚠️ Kişisel beyanların (senin denkliklerin, muafiyetlerin) yeri burası DEĞİL:
#    onlar `config/denklikler.toml` dosyasında ve repoya girmez.

# ============================================================================
# ÖNŞART METNİ BEYANI
#
# Bunlar öğrenciyle ilgili DEĞİL — kaynak verisinin bozuk olduğunun beyanı.
# OBS bazı derslerde önşart alanına önşart yazmıyor; ayrıştırıcı haklı olarak
# çözemiyor ve motor o derste "BİLİNMİYOR" diyor.
#
#   [[onsart_beyani]]
#   ders   = "MST 471"
#   onsart = ""            # boş = ÖNŞART YOK  (≠ bilinmiyor)
#   not_   = "neden böyle olduğunun gerekçesi"
#
# ⚠️ `onsart = ""` bir İDDİADIR: yanlışsa alınamayacak bir ders alınabilir
#    görünür. Her beyanı gerekçelendir; motor gerekçeyi `make refresh`
#    raporunda gösterir.

# Katalogda önşart alanına dersin KENDİ ADI yazılmış — önşart değil.
[[onsart_beyani]]
ders   = "MST 471"
onsart = ""
not_   = "Katalogda önşart alanında ders adı var ('Deniz Kazalarıve Emniyet Kültürü'); önşart beyanı değil. Doğrulandı 22.08.2026."

# Katalogda önşart alanına dersin DİLİ yazılmış — önşart değil.
[[onsart_beyani]]
ders   = "ROS 201"
onsart = ""
not_   = "Katalogda önşart alanında 'Türkçe' yazıyor; dil bilgisi, önşart değil. Doğrulandı 22.08.2026."

# ============================================================================
# YERLEŞKE BEYANI (Faz 94)
#
# Katalogun bina tablosunda bazı binaların yerleşkesi BOŞ. Yerleşke
# bilinmeyince "arka arkaya iki ders farklı yerleşkede" uyarısı ve kampüs
# değişimi tercihi o dersleri göremiyor. Beyan yalnız katalog boşken
# kullanılır; katalogdaki değeri ezmez.
#
#   [[kampus_beyani]]
#   bina   = "MEDC"
#   kampus = "Ayazağa Yerleşkesi"     # katalogdaki yazımla AYNI olmalı
#   not_   = "gerekçe"
#
# ⚠️ Emin olunmayan bina beyan EDİLMEZ (ör. YDY): bilinmeyen, bilinmeyen kalır.

[[kampus_beyani]]
bina   = "MEDC"
kampus = "Ayazağa Yerleşkesi"
not_   = "Katalog adı 'Merkezi Derslik C Binası'; A (MED) ve B (MEDB) binaları katalogda Ayazağa'da. 25.09.2026."

[[kampus_beyani]]
bina   = "BBB"
kampus = "Ayazağa Yerleşkesi"
not_   = "Katalog adı 'Bilgisayar ve Bilişim Binası'; Bilgisayar ve Bilişim Fakültesi Ayazağa'da. 25.09.2026."

[[kampus_beyani]]
bina   = "MSB"
kampus = "Maçka Yerleşkesi"
not_   = "Katalog adı 'Maçka Silahhane Binası'; yerleşke adı binanın adında. 25.09.2026."
