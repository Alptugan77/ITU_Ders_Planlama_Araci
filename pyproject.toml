[project]
name = "itucap"
version = "0.1.0"
description = "İTÜ DEPAR — Ders Planlama Aracı (ÇAP ve yandal destekli)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
itucap = "itucap.pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Faz 43 — yazı tipleri pakete giriyor: arayüz onları CSS'e gömüyor,
# böylece hiçbir çıktı Google Fonts'a istek atmıyor (SIL OFL 1.1,
# lisans metinleri yanlarında).
itucap = ["*.sql", "fonts/*.woff2", "fonts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
